openapi: 3.0.3
info:
  title: ZTNet Organization Network Rest API
  version: 1.0.0
  description: |
    Access the ZTNet Organization suite through our RESTful Web API. 
    
    This interface is subject to a rate limit of 50 requests per minute to ensure service reliability.

servers:
  - url: https://ztnet.network/api/v1
    description: ZTNet Organization API

components:
  securitySchemes:
    x-ztnet-auth:
      type: apiKey
      in: header
      name: x-ztnet-auth
      description: API key required for access

security:
  - x-ztnet-auth: []
paths:
  /org/:orgid/network:
    get:
      summary: Returns a list of Networks in the Organization you have access to
      description: |
        Returns an array of Networks you have access to.
      operationId: getUserNetworks
      parameters:
        - name: orgid
          in: path
          required: true
          schema:
            type: string
          description: Unique identifier of the organization

      responses:
        200:
          description: An array of Network IDs
          content:
            application/json:
              schema:
                $ref: '../../_schema/NetworkSchema.yml#/NetworkResponse'
              example:
                $ref: '../../_example/NetworkExample.yml#/NetworkArrayExample'
        401:
          $ref: '../../_http_responses/Unauthorized.yml#/Unauthorized'
        429:
          $ref: '../../_http_responses/RateLimitExceeded.yml#/RateLimitExceeded'
        500:
          $ref: '../../_http_responses/InternalServerError.yml#/InternalServerError'

    # POST /network
    post:
      summary: Create New Network within the Organization
      operationId: createNewNetwork
      parameters:
        - name: orgid
          in: path
          required: true
          schema:
            type: string
          description: Unique identifier of the organization
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              # required:
              #   - name
              properties:
                name:
                  type:
                    - string
                  required: false
                  description: Name of the network. If not provided, a random name will be generated.
      responses:
        200:
          description: New Network Created
          content:
            application/json:
              schema:
                $ref: '../../_schema/NetworkSchema.yml#/NetworkResponse'
              example:
                $ref: '../../_example/NetworkExample.yml#/NetworkExample'
                
        401:
          $ref: '../../_http_responses/Unauthorized.yml#/Unauthorized'
        403:
          description: |
            The organization has reached its network quota. The quota is set by the instance administrator, see [Organization Quotas](/usage/organization-quotas/).
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: "This organization has reached its limit of 5 networks. Contact the instance administrator to raise the limit."
        429:
          $ref: '../../_http_responses/RateLimitExceeded.yml#/RateLimitExceeded'
        500:
          $ref: '../../_http_responses/InternalServerError.yml#/InternalServerError'

  /org/:orgid/network/{networkId}:
    get:
      summary: Returns information about a specific organization network
      operationId: getNetworkInfo
      parameters:
        - name: networkId
          in: path
          required: true
          schema:
            type: string
          description: Unique identifier of the network
        - name: orgid
          in: path
          required: true
          schema:
            type: string
          description: Unique identifier of the organization
      responses:
        200:
          description: Detailed information of the specified Network
          content:
            application/json:
              schema:
                $ref: '../../_schema/NetworkSchema.yml#/NetworkResponse'
              example:
                $ref: '../../_example/NetworkExample.yml#/NetworkExample'
        401:
          $ref: '../../_http_responses/Unauthorized.yml#/Unauthorized'
        429:
          $ref: '../../_http_responses/RateLimitExceeded.yml#/RateLimitExceeded'
        500:
          $ref: '../../_http_responses/InternalServerError.yml#/InternalServerError'
    post:
      summary: Update a specific organization network
      description: Requires the USER role or higher in the organization. READ_ONLY members can only read the network. Changing `routes`, `dns`, `ipAssignmentPools`, `v4AssignMode`, `v6AssignMode` or `flowRule` requires the minimum role set in the organization's network settings (USER by default, can be raised to MODERATOR or ADMIN); a lower role gets 403.
      operationId: updateNetworkInfo
      parameters:
        - name: networkId
          in: path
          required: true
          schema:
            type: string
          description: Unique identifier of the network
        - name: orgid
          in: path
          required: true
          schema:
            type: string
          description: Unique identifier of the organization
      requestBody:
        required: false
        description: Each field is optional. Only the fields that are provided will be updated.
        content:
          application/json:
            schema:
              $ref: '../../_schema/NetworkSchema.yml#/UpdateNetworkShema'
      responses:
        200:
          description: Network Updated
          content:
            application/json:
              schema:
                $ref: '../../_schema/NetworkSchema.yml#/NetworkResponse'
              example:
                $ref: '../../_example/NetworkExample.yml#/NetworkExample'
        401:
          $ref: '../../_http_responses/Unauthorized.yml#/Unauthorized'
        403:
          description: |
            Returned when:
            - the API key's user does not have the organization role this request needs, for example below the organization's minimum role to change network configuration.
            - `private: false` was sent for a network of an organization that has a limit on authorized members per network. Such a network cannot be made public, see [Organization Quotas](/usage/organization-quotas/).
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              examples:
                role:
                  value:
                    error: "You don't have required permission to perform this action. Contact your organization administrator to request access."
                quota:
                  value:
                    error: "This organization has a limit on authorized members per network, so its networks cannot be made public. Contact the instance administrator."
        429:
          $ref: '../../_http_responses/RateLimitExceeded.yml#/RateLimitExceeded'
        500:
          $ref: '../../_http_responses/InternalServerError.yml#/InternalServerError'
    delete:
      summary: Delete a specific organization network
      operationId: deleteNetwork
      parameters:
        - name: networkId
          in: path
          required: true
          schema:
            type: string
          description: Unique identifier of the network
        - name: orgid
          in: path
          required: true
          schema:
            type: string
          description: Unique identifier of the organization
      responses:
        204:
          description: Network successfully deleted
        401:
          $ref: '../../_http_responses/Unauthorized.yml#/Unauthorized'
        429:
          $ref: '../../_http_responses/RateLimitExceeded.yml#/RateLimitExceeded'
        500:
          $ref: '../../_http_responses/InternalServerError.yml#/InternalServerError'
